<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 960px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 24px; }
        header h1 { font-size: 2.4em; margin-bottom: 8px; }
        header p { opacity: 0.9; }
        nav { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        nav a { color: white; text-decoration: none; padding: 10px 20px; border: 2px solid rgba(255,255,255,0.4); border-radius: 8px; }
        nav a.active { background: white; color: #667eea; border-color: white; }
        .card { background: white; border-radius: 10px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .card h2 { margin-bottom: 20px; color: #333; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .form-group { margin-bottom: 20px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 0.95em; }
        textarea { height: 160px; resize: vertical; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #667eea; }
        button { padding: 12px 26px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; margin-right: 8px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        button.secondary { background: #f0f0f0; color: #333; margin-right: 0; }
        .result-bar { margin-bottom: 18px; }
        .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-head h3 { margin: 0; }
        .copy-btn { padding: 8px 16px; font-size: 0.9em; margin: 0; }
        .card h3 { margin-bottom: 10px; color: #333; }
        .error { background: #ffe0e0; color: #e74c3c; padding: 15px; border-radius: 8px; border-left: 4px solid #e74c3c; margin-bottom: 20px; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .hint { color: #666; font-size: 0.9em; margin-top: 6px; }
        .hidden { display: none; }

        .mode-options { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .mode-options label { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: 600; color: #333; margin: 0; }
        .mode-options input[type="radio"] { accent-color: #667eea; }
        .mode-options label.selected { border-color: #667eea; background: #f7f8ff; }

        .step { border-left: 4px solid #667eea; padding: 4px 0 4px 16px; margin-bottom: 24px; }
        .step-title { font-weight: 700; color: #333; margin-bottom: 10px; }
        .step-num { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 50%; background: #667eea; color: white; margin-right: 8px; font-size: 0.9em; }

        .dropzone { border: 2px dashed #667eea; border-radius: 10px; padding: 32px 20px; text-align: center; cursor: pointer; background: #f7f8ff; }
        .dropzone.over { background: #e6e9ff; }
        .dropzone strong { display: block; font-size: 1.05em; color: #333; margin-bottom: 6px; }
        .dropzone small { color: #666; }
        .file-name { margin-top: 12px; color: #0b5d1e; font-weight: 600; min-height: 1.2em; }
        #file { display: none; }

        .result-card { background: #f9f9f9; border-left: 4px solid #667eea; padding: 20px; margin-bottom: 18px; border-radius: 8px; }
        .result-card h3 { color: #667eea; margin-bottom: 12px; font-size: 1.15em; }
        .skill-item { background: white; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 3px solid #4caf50; }
        .skill-name { font-weight: 600; }
        .skill-evidence { color: #666; font-size: 0.9em; font-style: italic; margin-top: 5px; }
        .missing-item { background: white; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 3px solid #ffc107; }
        .suggestion-item { background: white; padding: 14px; margin-bottom: 12px; border-radius: 6px; }
        .suggestion-label { font-size: 0.8em; font-weight: 600; color: #999; text-transform: uppercase; margin-bottom: 4px; }
        .pre-wrap { white-space: pre-wrap; background: #fff; padding: 14px; border-radius: 6px; border: 1px solid #ddd; }
        ul.plain { padding-left: 20px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Resume Assistant</h1>
            <p>Analyze your resume against a job description</p>
        </header>
        <nav>
            <a href="/" class="active">Analyze Resume</a>
            <a href="/formatresume.html">Format Resume</a>
            <a href="/coverletter.html">Cover Letter</a>
        </nav>

        <div class="card" id="input-view">
            <h2>Analyze Your Resume</h2>

            <div class="mode-options">
                <label id="opt-upload" class="selected">
                    <input type="radio" name="mode" value="upload" checked>
                    Upload your resume
                </label>
                <label id="opt-type">
                    <input type="radio" name="mode" value="type">
                    Add your resume
                </label>
            </div>

            <!-- Step 1: resume -->
            <div class="step">
                <div class="step-title"><span class="step-num">1</span>
                    <span id="step1-label">Upload your resume</span></div>

                <div id="mode-upload">
                    <div id="drop" class="dropzone">
                        <strong>Drag &amp; drop your resume here</strong>
                        <small>or click to choose a file</small>
                        <div class="file-name" id="file-name"></div>
                    </div>
                    <input type="file" id="file" accept=".doc,.docx,.pdf,.txt">
                    <p class="hint">Accepted file formats: DOC, DOCX, PDF, and TXT (max 5 MB)</p>
                </div>

                <div id="mode-type" class="hidden">
                    <textarea id="resume" placeholder="Type or paste your resume here..."></textarea>
                </div>
            </div>

            <!-- Step 2: job description -->
            <div class="step">
                <div class="step-title"><span class="step-num">2</span>Add the job description</div>
                <textarea id="job" placeholder="Paste the job description here..."></textarea>
            </div>

            <div id="message"></div>
            <button id="btn" onclick="analyze()">Analyze Resume</button>
        </div>

        <div id="output"></div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const ALLOWED = ['.doc', '.docx', '.pdf', '.txt'];
        let selectedFile = null;
        let lastAnalysis = null;

        const fileInput = document.getElementById('file');
        const dropZone = document.getElementById('drop');

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function showMessage(text) {
            document.getElementById('message').innerHTML = text ? `<div class="error">${escapeHtml(text)}</div>` : '';
        }

        function currentMode() {
            return document.querySelector('input[name="mode"]:checked').value;
        }

        // Switch between the two options
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const upload = currentMode() === 'upload';
                document.getElementById('mode-upload').classList.toggle('hidden', !upload);
                document.getElementById('mode-type').classList.toggle('hidden', upload);
                document.getElementById('opt-upload').classList.toggle('selected', upload);
                document.getElementById('opt-type').classList.toggle('selected', !upload);
                document.getElementById('step1-label').textContent = upload ? 'Upload your resume' : 'Add your resume';
                showMessage('');
            });
        });

        // File selection
        function setFile(file) {
            if (!file) return;
            if (!ALLOWED.some(ext => file.name.toLowerCase().endsWith(ext))) {
                selectedFile = null;
                document.getElementById('file-name').textContent = '';
                return showMessage('Accepted file formats: DOC, DOCX, PDF, and TXT');
            }
            selectedFile = file;
            document.getElementById('file-name').textContent = `Selected: ${file.name}`;
            showMessage('');
        }

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => setFile(e.target.files[0]));
        ['dragenter', 'dragover'].forEach(t =>
            dropZone.addEventListener(t, e => { e.preventDefault(); dropZone.classList.add('over'); }));
        ['dragleave', 'drop'].forEach(t =>
            dropZone.addEventListener(t, e => { e.preventDefault(); dropZone.classList.remove('over'); }));
        dropZone.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

        async function readJson(response) {
            const raw = await response.text();
            let body;
            try {
                body = JSON.parse(raw);
            } catch {
                throw new Error(`Server returned non-JSON (HTTP ${response.status})`);
            }
            if (!response.ok) {
                throw new Error(typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail));
            }
            return body;
        }

        async function analyze() {
            const upload = currentMode() === 'upload';
            const job = document.getElementById('job').value.trim();
            const btn = document.getElementById('btn');
            const out = document.getElementById('output');

            showMessage('');
            out.innerHTML = '';
            if (upload && !selectedFile) return showMessage('Step 1: please choose a resume file');
            if (!upload && !document.getElementById('resume').value.trim()) return showMessage('Step 1: please enter your resume');
            if (!job) return showMessage('Step 2: please paste the job description');

            btn.disabled = true;
            out.innerHTML = '<div class="card loading">Analyzing your resume...</div>';
            try {
                let response;
                if (upload) {
                    const form = new FormData();
                    form.append('file', selectedFile);
                    form.append('job_description', job);
                    response = await fetch(`${API_URL}/api/analyze/upload`, { method: 'POST', body: form });
                } else {
                    const resume = document.getElementById('resume').value.trim();
                    response = await fetch(`${API_URL}/api/analyze`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ resume, job_description: job })
                    });
                }
                lastAnalysis = await readJson(response);
                showResultView(renderAnalysis(lastAnalysis));
            } catch (err) {
                out.innerHTML = '';
                showMessage(`Error: ${err.message}`);
            } finally {
                btn.disabled = false;
            }
        }

        function renderAnalysis(d) {
            const e = escapeHtml;
            const section = (title, html) => html ? `<div class="result-card"><h3>${title}</h3>${html}</div>` : '';

            const summary = d.resume_summary ? `<p>${e(d.resume_summary)}</p>` : '';
            const reqs = (d.job_requirements || []).length
                ? `<ul class="plain">${d.job_requirements.map(r => `<li>${e(r)}</li>`).join('')}</ul>` : '';
            const skills = (d.matching_skills || []).map(s =>
                `<div class="skill-item"><div class="skill-name">${e(s.skill)}</div>
                 <div class="skill-evidence">"${e(s.evidence)}"</div></div>`).join('');
            const missing = (d.missing_areas || []).map(m => `<div class="missing-item">${e(m)}</div>`).join('');
            const sugg = (d.suggestions || []).map(s =>
                `<div class="suggestion-item">
                    <div class="suggestion-label">Original</div><div>${e(s.original)}</div>
                    <div class="suggestion-label" style="margin-top:8px">Improved</div><div>${e(s.improved)}</div>
                    <div class="suggestion-label" style="margin-top:8px">Why</div><div>${e(s.reason)}</div>
                 </div>`).join('');
            const improved = d.improved_resume
                ? `<div class="result-card">
                    <div class="card-head">
                        <h3>Improved Resume</h3>
                        <button class="copy-btn" onclick="copyImproved(this)">Copy</button>
                    </div>
                    <div class="pre-wrap">${e(d.improved_resume)}</div>
                </div>`
                : '';

            return `
                ${section('Resume Summary', summary)}
                ${section('Job Requirements', reqs)}
                ${section('Matching Skills', skills)}
                ${section('Missing or Weak Areas', missing)}
                ${section('Improvement Suggestions', sugg)}
                ${improved}
                <div class="card">
                    <h3>Export</h3>
                    <p style="margin:10px 0">Download your analysis:</p>
                    <button onclick="exportAnalysis('txt')">TXT</button>
                    <button onclick="exportAnalysis('pdf')">PDF</button>
                    <button onclick="exportAnalysis('docx')">DOCX</button>
                </div>`;
        }

        async function exportAnalysis(format) {
            if (!lastAnalysis) return alert('Run an analysis first');
            try {
                const response = await fetch(`${API_URL}/api/export/${format}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ analysis_results: lastAnalysis })
                });
                if (!response.ok) throw new Error(`Export failed (HTTP ${response.status})`);
                const url = URL.createObjectURL(await response.blob());
                const a = document.createElement('a');
                a.href = url;
                a.download = `resume_analysis.${format}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (err) {
                alert(err.message);
            }
        }

        function showResultView(html) {
            document.getElementById('input-view').classList.add('hidden');
            document.getElementById('output').innerHTML =
                `<div class="result-bar"><button class="secondary" onclick="newAnalysis()">← New analysis</button></div>` + html;
            window.scrollTo(0, 0);
        }

        function newAnalysis() {
            document.getElementById('input-view').classList.remove('hidden');
            document.getElementById('output').innerHTML = '';
            document.getElementById('resume').value = '';
            document.getElementById('job').value = '';
            document.getElementById('file-name').textContent = '';
            selectedFile = null;
            lastAnalysis = null;
            showMessage('');
        }

        function copyImproved(btn) {
            const text = lastAnalysis?.improved_resume || '';
            const done = () => {
                btn.textContent = 'Copied';
                setTimeout(() => btn.textContent = 'Copy', 1500);
            };
            const fallback = () => {
                const t = document.createElement('textarea');
                t.value = text;
                document.body.appendChild(t);
                t.select();
                document.execCommand('copy');
                t.remove();
                done();
            };
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(done).catch(fallback);
            } else {
                fallback();
            }
        }
    </script>
</body>
</html>
